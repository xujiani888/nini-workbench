<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌸 妮妮的工作台</title>
<style>
/* ========== Reset & Variables ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff5f7; --card-bg:#fff; --sidebar-bg:#ffe8ee;
  --pink-light:#ffe0e8; --pink:#f8a4c8; --pink-mid:#f472b6; --pink-deep:#e85d9a; --pink-accent:#db2777;
  --lavender:#e8d5f5; --mint:#c5f0e0; --peach:#ffe0cc; --sky:#cce5ff; --yellow:#fff3c4;
  --text:#4a3040; --text-secondary:#8a6e7a; --text-muted:#b8a0aa;
  --shadow:0 2px 12px rgba(228,150,180,0.15); --shadow-lg:0 8px 30px rgba(228,150,180,0.2);
  --radius:16px; --radius-sm:10px; --radius-xs:8px;
  --sidebar-width:200px;
  --font:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --accent:var(--pink); --accent-soft:var(--pink-light); --accent-deep:var(--pink-deep);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}

/* ========== Layout ========== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-width);background:linear-gradient(180deg,#ffe8ee 0%,#ffd6e0 50%,#ffe0e8 100%);z-index:100;overflow-y:auto;display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(228,150,180,0.12);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.sidebar-logo{padding:24px 16px 8px;text-align:center;border-bottom:1px solid rgba(228,150,180,0.2);}
.sidebar-logo .logo-icon{font-size:38px;display:block;margin-bottom:4px;}
.sidebar-logo .logo-text{font-size:18px;font-weight:700;color:var(--pink-deep);}
.sidebar-logo .logo-sub{font-size:11px;color:var(--pink-mid);margin-top:2px;}
.sidebar-nav{flex:1;padding:8px 0;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;margin:4px 10px;border-radius:14px;cursor:pointer;color:var(--text-secondary);font-size:14px;font-weight:500;transition:all .2s;border:none;background:none;width:calc(100% - 20px);text-align:left;border-left:3px solid transparent;}
.nav-item:hover{background:var(--ncs,var(--pink-light));color:var(--nc,var(--pink-deep));transform:translateX(3px);}
.nav-item.active{background:var(--ncs,var(--pink-light));color:var(--nc,var(--pink-deep));font-weight:700;box-shadow:0 2px 10px rgba(228,150,180,0.2);border-left:3px solid var(--nc,var(--pink-deep));}
.nav-item .nav-badge{font-size:15px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--ncs,var(--pink-light));flex-shrink:0;transition:all .2s;box-shadow:0 2px 6px rgba(228,150,180,0.18);}
.nav-item.active .nav-badge{background:linear-gradient(135deg,var(--nc,var(--pink)),var(--ncd,var(--pink-deep)));transform:scale(1.05);}
.nav-item .nav-label{flex:1;line-height:1.3;}
.nav-item .nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0;}

.main-content{margin-left:var(--sidebar-width);min-height:100vh;transition:margin .3s cubic-bezier(.4,0,.2,1);}
.page{padding:28px 32px;max-width:900px;display:none;animation:fadeIn .35s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ========== Mobile Header ========== */
.mobile-header{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:linear-gradient(135deg,#fce4ec,#f8bbd0);padding:12px 16px;box-shadow:0 2px 12px rgba(228,150,180,0.15);align-items:center;gap:12px;}
.mobile-header .hamburger{font-size:24px;background:none;border:none;color:var(--pink-deep);cursor:pointer;padding:4px 8px;border-radius:8px;flex-shrink:0;}
.mobile-header .mobile-title{font-size:16px;font-weight:700;color:var(--pink-deep);flex:1;text-align:center;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:98;transition:opacity .3s;}
.overlay.show{display:block;}
.img-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
.img-lightbox.show{display:flex;}
.img-lightbox-img{max-width:92%;max-height:80%;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.5);object-fit:contain;}
.img-lightbox-close{position:absolute;top:18px;right:20px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.18);color:#fff;font-size:24px;line-height:42px;text-align:center;cursor:pointer;border:none;transition:all .2s;z-index:2;}
.img-lightbox-close:hover{background:rgba(255,255,255,0.32);transform:scale(1.06);}
.img-lightbox-hint{position:absolute;bottom:22px;color:rgba(255,255,255,0.65);font-size:12px;}
.sidebar-close{display:none;position:absolute;top:12px;right:12px;font-size:22px;background:none;border:none;color:var(--pink-deep);cursor:pointer;padding:4px 8px;border-radius:8px;}

/* ========== Components ========== */
.card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:18px;border:1px solid rgba(228,150,180,0.1);border-top:3px solid var(--accent);}
.card-sm{padding:14px 16px;}
.card-title{font-size:16px;font-weight:700;color:var(--accent-deep);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title .ct-icon{font-size:20px;}
.section-divider{height:1px;background:linear-gradient(90deg,transparent,var(--pink-light),transparent);margin:24px 0;}
.sub-section{background:linear-gradient(135deg,var(--accent-soft),#fff);border-radius:var(--radius-sm);padding:16px;margin-bottom:14px;border:1px solid var(--accent-soft);}
.sub-section-title{font-size:14px;font-weight:700;color:var(--pink-mid);margin-bottom:10px;display:flex;align-items:center;gap:6px;}

.btn{padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;font-family:var(--font);display:inline-flex;align-items:center;gap:4px;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(228,150,180,0.25);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;}
.btn-secondary{background:var(--pink-light);color:var(--pink-deep);}
.btn-danger{background:#fff0f0;color:#e55;border:1px solid #fcc;}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:16px;}
.btn-xs{padding:3px 10px;font-size:11px;border-radius:12px;}
.btn-icon{padding:6px;border-radius:50%;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;}

input,textarea,select{width:100%;padding:10px 14px;border:2px solid var(--pink-light);border-radius:var(--radius-xs);font-size:14px;color:var(--text);background:#fefefe;transition:border-color .2s;font-family:var(--font);outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--pink-mid);box-shadow:0 0 0 3px rgba(244,114,182,0.1);}
textarea{resize:vertical;min-height:80px;line-height:1.6;}
input[type="date"],input[type="time"]{cursor:pointer;}
#dlPlanStart,#dlPlanEnd{padding:6px 8px;min-height:36px;font-size:13px;flex:0 0 100px !important;}

/* ========== Clock ========== */
.clock-card{text-align:center;padding:32px 20px;background:linear-gradient(135deg,#fce4ec,#f8bbd0,#fce4ec);border-radius:var(--radius);box-shadow:var(--shadow-lg);margin-bottom:18px;}
.clock-date{font-size:14px;color:var(--pink-deep);margin-bottom:4px;font-weight:500;}
.clock-time{font-size:52px;font-weight:800;color:var(--pink-accent);letter-spacing:2px;font-variant-numeric:tabular-nums;font-family:'SF Mono','Menlo','Consolas',monospace;}
.clock-seconds{font-size:18px;color:var(--pink-mid);vertical-align:super;margin-left:4px;}

/* ========== Quote ========== */
.quote-card{text-align:center;padding:18px 20px;background:linear-gradient(135deg,#fff5f7,#fce4ec);border-radius:var(--radius-sm);margin-bottom:18px;border-left:4px solid var(--pink);}
.quote-cn{font-size:15px;font-weight:600;color:var(--pink-deep);line-height:1.6;margin-bottom:6px;}
.quote-en{font-size:13px;color:var(--text-muted);font-style:italic;line-height:1.5;}

/* ========== Task List ========== */
.task-input-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-end;}
.task-input-row input{flex:1;min-width:100px;}
.task-list{list-style:none;min-height:20px;}
.task-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:6px;background:#fff;border-radius:var(--radius-xs);border:1px solid var(--pink-light);cursor:grab;transition:all .2s;user-select:none;}
.task-item:active{cursor:grabbing;}
.task-item.dragging{opacity:0.5;border-style:dashed;}
.task-item.drag-over{border-color:var(--pink-mid);background:var(--pink-light);}
.task-item.done{opacity:0.55;}
.task-item.done .task-text{text-decoration:line-through;color:var(--text-muted);}
.task-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--pink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s;font-size:12px;color:transparent;position:relative;-webkit-tap-highlight-color:transparent;}
.task-check::before{content:'';position:absolute;inset:-12px;border-radius:50%;}
.task-item.done .task-check{background:var(--pink-mid);border-color:var(--pink-mid);color:#fff;}
.task-text{flex:1;font-size:14px;color:var(--text);word-break:break-word;}
.task-meta{font-size:12px;color:var(--text-muted);flex-shrink:0;white-space:nowrap;}
.task-link-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--accent-deep);cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0;padding:3px 8px;border-radius:12px;border:1px solid var(--accent-soft);background:#fff;transition:all .2s;}
.task-link-btn:hover{background:var(--accent-soft);color:var(--accent-deep);}
.task-link-btn svg{width:13px;height:13px;fill:currentColor;}
.task-link-input{flex:1;min-width:140px;}
.task-del{background:none;border:none;color:#ddd;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;transition:all .2s;flex-shrink:0;}
.task-del:hover{color:#e55;background:#fff0f0;}
.task-drag-handle{color:#ddd;font-size:14px;cursor:grab;flex-shrink:0;padding:0 4px;}
.empty-hint{text-align:center;color:var(--text-muted);font-size:13px;padding:20px;}

/* ========== Checkin Tags ========== */
.checkin-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.checkin-tag{padding:8px 16px;border-radius:20px;border:2px solid var(--pink-light);cursor:pointer;font-size:13px;font-weight:500;color:var(--text-secondary);background:#fff;transition:all .2s;user-select:none;}
.checkin-tag.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:700;}

/* ========== Spending ========== */
.spending-form{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;}
.spending-form input,.spending-form select{flex:1;min-width:80px;}
.spending-summary{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.spending-stat{flex:1;min-width:100px;text-align:center;padding:12px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#fce4ec,#fff);}
.spending-stat .ss-val{font-size:22px;font-weight:800;color:var(--pink-accent);}
.spending-stat .ss-label{font-size:12px;color:var(--text-muted);margin-top:2px;}
.spending-table{width:100%;border-collapse:collapse;font-size:13px;}
.spending-table th{background:var(--accent-soft);color:var(--accent-deep);padding:8px 10px;text-align:left;font-weight:600;}
.spending-table td{padding:8px 10px;border-bottom:1px solid var(--pink-light);}
.spending-table .amount{font-weight:600;color:var(--pink-accent);}

/* ========== Exercise Checkin ========== */
.ex-stats-card{display:flex;align-items:center;gap:12px;padding:18px 16px;margin-bottom:14px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#8ec5fc,#e0c3fc);color:#fff;box-shadow:0 6px 18px rgba(142,197,252,.25);}
.ex-stat{flex:1;text-align:center;}
.ex-stat-num{font-size:34px;font-weight:800;line-height:1.1;text-shadow:0 2px 4px rgba(0,0,0,.1);}
.ex-stat-label{font-size:13px;opacity:.95;margin-top:6px;}
.ex-stat-divider{width:1px;height:44px;background:rgba(255,255,255,.45);}
.ex-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.ex-type-tag{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 6px;border-radius:20px;border:2px solid var(--pink-light);background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-secondary);transition:all .2s;user-select:none;-webkit-tap-highlight-color:transparent;}
.ex-type-tag.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:700;}
.ex-duration-input{width:100%;padding:12px 14px;border-radius:var(--radius-xs);border:1px solid var(--pink-light);font-size:14px;margin-bottom:12px;outline:none;box-sizing:border-box;}
.ex-duration-input:focus{border-color:var(--accent);}
.ex-checkin-btn{width:100%;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;margin-bottom:12px;}
.ex-today-list{margin-top:10px;}
.ex-today-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-radius:var(--radius-xs);border:1px solid var(--pink-light);margin-bottom:8px;font-size:14px;}
.ex-today-type{background:var(--accent-soft);color:var(--accent-deep);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
.ex-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
.ex-cal-header{font-size:12px;color:var(--text-muted);padding:6px 0;font-weight:500;}
.ex-cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;color:var(--text-secondary);background:#f8f8f8;}
.ex-cal-cell.empty{background:transparent;}
.ex-cal-cell.checked{background:var(--accent);color:#fff;font-weight:700;}
.ex-cal-cell.today{box-shadow:0 0 0 2px var(--accent-deep);}

/* ========== Repayment Card ========== */
.repayment-card{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;background:#fff;border-radius:var(--radius-xs);border:1px solid var(--pink-light);flex-wrap:wrap;}
.repayment-card .rp-name{font-weight:600;color:var(--pink-deep);min-width:70px;}
.repayment-card .rp-amounts{font-size:13px;color:var(--text-secondary);min-width:100px;}
.progress-bar-wrap{flex:1;min-width:80px;height:8px;background:var(--pink-light);border-radius:4px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--pink-mid));border-radius:4px;transition:width .3s;}
.progress-label{font-size:12px;font-weight:600;color:var(--pink-mid);min-width:60px;text-align:right;}
.plan-progress{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--accent-deep);}
.pp-bar{width:90px;height:8px;border-radius:6px;background:var(--accent-soft);overflow:hidden;}
.pp-fill{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:6px;transition:width .3s;}
.pp-text{white-space:nowrap;}

/* ========== Review History ========== */
.review-card{margin-bottom:14px;padding:14px;background:#fff;border-radius:var(--radius-sm);border:1px solid var(--pink-light);}
.review-card .review-date{font-size:12px;color:var(--text-muted);margin-bottom:8px;font-weight:500;}
.review-card .review-content{font-size:14px;color:var(--text);line-height:1.7;white-space:pre-wrap;word-break:break-word;}
.review-card .review-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.review-card .review-images img{max-width:120px;max-height:120px;border-radius:8px;object-fit:cover;border:2px solid var(--pink-light);cursor:pointer;}
.review-card .review-actions{margin-top:10px;display:flex;gap:6px;}

/* ========== 今日分享 ========== */
.share-card{border:1px solid rgba(244,114,182,0.25);background:linear-gradient(180deg,#fff,#fff8fb);}
.btn-pink-soft{background:#fff;color:var(--pink-mid);border:2px solid var(--pink-light);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;}
.btn-pink-soft:hover{background:var(--pink-light);color:var(--pink-accent);}
.share-preview{background:linear-gradient(135deg,#fce4ec,#f8bbd0,#fce4ec);border-radius:var(--radius-sm);padding:18px 16px;color:var(--pink-deep);font-size:14px;line-height:1.7;}
.share-preview .sp-title{font-size:16px;font-weight:800;color:var(--pink-accent);text-align:center;margin-bottom:10px;}
.share-preview .sp-sec{font-size:14px;font-weight:700;color:var(--pink-deep);margin-top:12px;margin-bottom:4px;}
.share-preview .sp-empty{color:var(--text-muted);font-size:13px;font-style:italic;}
.share-preview .sp-item{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word;padding-left:2px;}
.share-preview .sp-total{font-size:13px;font-weight:700;color:var(--pink-accent);margin-top:4px;}
.share-preview .sp-foot{text-align:center;font-size:12px;color:var(--pink-mid);margin-top:12px;}
.share-preview .sp-imgs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px 2px;}
.share-preview .sp-img{width:62px;height:62px;object-fit:cover;border-radius:8px;border:2px solid var(--pink-light);cursor:pointer;transition:transform .15s;}
.share-preview .sp-img:hover{transform:scale(1.04);}

/* ========== Image Upload ========== */
.img-upload-area{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center;}
.img-upload-btn{padding:8px 14px;border-radius:20px;background:var(--pink-light);color:var(--pink-deep);border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font);transition:all .2s;display:inline-flex;align-items:center;gap:4px;}
.img-upload-btn:hover{background:var(--pink);color:#fff;}
.img-preview-thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;border:2px solid var(--pink-light);position:relative;}
.img-preview-wrap{position:relative;display:inline-block;}
.img-preview-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#e55;color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}

/* ========== Growth Tabs ========== */
.growth-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.growth-tab{padding:8px 18px;border-radius:20px;border:2px solid var(--pink-light);background:#fff;color:var(--text-secondary);cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font);transition:all .2s;}
.growth-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:var(--accent);}

/* ========== AI 每日榜单 ========== */
.ai-rank-card{border:1px solid rgba(244,114,182,0.25);background:linear-gradient(180deg,#fff,#fff8fb);}
.airank-meta{font-size:12px;color:var(--text-secondary);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.airank-meta b{color:var(--pink-deep);}
.btn-mini{padding:3px 12px;font-size:11px;border-radius:12px;background:#fff;color:var(--pink-mid);border:1px solid var(--pink-light);cursor:pointer;font-family:var(--font);transition:all .2s;}
.btn-mini:hover{background:var(--pink-light);color:var(--pink-accent);}
.airank-list{display:flex;flex-direction:column;gap:12px;}
.airank-item{background:#fff;border:1px solid var(--pink-light);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:0 1px 6px rgba(228,150,180,0.08);}
.airank-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.airank-rank{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pink-mid),var(--pink-accent));color:#fff;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.airank-name{font-size:15px;font-weight:700;color:var(--pink-deep);text-decoration:none;cursor:pointer;transition:color .2s;}
.airank-name:hover{color:var(--pink-accent);}
.airank-tag{font-size:11px;color:var(--text-secondary);background:var(--pink-light);padding:2px 10px;border-radius:12px;margin-left:auto;}
.airank-body{display:flex;gap:12px;flex-wrap:wrap;}
.airank-col{flex:1;min-width:160px;background:#fff8fb;border-radius:var(--radius-xs);padding:10px 12px;}
.airank-label{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;margin-bottom:8px;}
.airank-label.good{background:#e6f9ee;color:#1f9d57;}
.airank-label.bad{background:#fdeaea;color:#e05656;}
.airank-point{font-size:12px;color:var(--text-secondary);line-height:1.7;padding-left:2px;}
.airank-pending{text-align:center;color:var(--text-muted);font-size:13px;padding:24px 10px;background:#fff8fb;border-radius:var(--radius-xs);}

function loadData(base) {
  try { return JSON.parse(localStorage.getItem('nini_' + base) || '[]'); }
  catch(e) { return []; }
}

function saveData(base, data) {
  try { localStorage.setItem('nini_' + base, JSON.stringify(data)); }
  catch(e) { alert('存储空间不足，请清理一些图片或旧数据~'); }
}

// 按 viewDate 筛选当前日期数据（渲染用）
function getByDate(base) {
  return loadData(base).filter(r => r.date === viewDate);
}

function getToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getNowTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function getOffsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ==================== IMAGE HANDLING ====================
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        const maxW = 800;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function createImageUpload(containerId, onImagesChange) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.style.display = 'none';
  container.appendChild(input);
  const btn = container.querySelector('.img-upload-btn');
  if (btn) {
    btn.addEventListener('click', () => input.click());
  }
  input.addEventListener('change', async () => {
    const files = Array.from(input.files);
    const existing = onImagesChange(null); // get current
    for (const f of files) {
      try {
        const b64 = await resizeImage(f);
        existing.push(b64);
      } catch(e) { console.error('Image load error', e); }
    }
    onImagesChange(existing);
    input.value = '';
  });
  window._photoUploads = window._photoUploads || {};
  window._photoUploads[containerId] = { input, onImagesChange };
}

function renderImagePreviews(images, container) {
  if (!images || !images.length) return;
  container.innerHTML = images.map((img, i) => `
    <div class="img-preview-wrap">
      <img class="img-preview-thumb" src="${img}" data-idx="${i}" alt="预览图">
      <button class="img-preview-remove" data-remove-img="${i}">×</button>
    </div>
  `).join('');
  container.querySelectorAll('.img-preview-thumb').forEach(thumb => {
    thumb.addEventListener('click', () => {
      const idx = parseInt(thumb.dataset.idx);
      openLightbox(images[idx]);
    });
  });
}

function openLightbox(src) {
  if (!src) return;
  const lb = document.getElementById('imgLightbox');
  const img = document.getElementById('imgLightboxImg');
  img.src = src;
  lb.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  const lb = document.getElementById('imgLightbox');
  lb.classList.remove('show');
  document.getElementById('imgLightboxImg').src = '';
  document.body.style.overflow = '';
}

function enableDragSort(listEl, dataArr, saveKey, renderFn) {
  if (listEl._wbDragBound) return;
  listEl._wbDragBound = true;
  function commitOrder() {
    // 拖拽子集可能是按日期过滤后的数组，保存时必须合并完整数据，避免覆盖其他日期记录
    const fullData = loadData(saveKey);
    const ids = dataArr.map(d => d.id);
    const reordered = [];
    ids.forEach(id => {
      const it = fullData.find(d => d.id === id);
      if (it) reordered.push(it);
    });
    const remaining = fullData.filter(d => !ids.includes(d.id));
    saveData(saveKey, reordered.concat(remaining));
    renderFn();
  }
  listEl.addEventListener('dragstart', (e) => {
    const item = e.target.closest('.task-item');
    if (!item) return;
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', item.dataset.id);
    setTimeout(() => item.style.display = 'none', 0);
  });
  listEl.addEventListener('dragend', (e) => {
    const item = e.target.closest('.task-item');
    if (!item) return;
    item.classList.remove('dragging');
    item.style.display = '';
    listEl.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
  });
  listEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const after = getDragAfter(listEl, e.clientY);
    listEl.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    if (after) after.classList.add('drag-over');
  });
  listEl.addEventListener('drop', (e) => {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const draggedItem = listEl.querySelector(`.task-item[data-id="${CSS.escape(draggedId)}"]`);
    listEl.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    if (!draggedItem) return;
    draggedItem.style.display = '';
    const after = getDragAfter(listEl, e.clientY);
    const fromIdx = dataArr.findIndex(d => d.id === draggedId);
    if (fromIdx === -1) return;
    const [moved] = dataArr.splice(fromIdx, 1);
    if (after) {
      const toIdx = dataArr.findIndex(d => d.id === after.dataset.id);
      dataArr.splice(toIdx, 0, moved);
    } else {
      dataArr.push(moved);
    }
    commitOrder();
  });

  // Touch support
  let touchDragItem = null, touchStartY = 0;
  listEl.addEventListener('touchstart', (e) => {
    const item = e.target.closest('.task-item');
    if (!item || e.target.closest('button') || e.target.closest('.task-check')) return;
    touchDragItem = item;
    touchStartY = e.touches[0].clientY;
  }, {passive: false});
  listEl.addEventListener('touchmove', (e) => {
    if (!touchDragItem) return;
    e.preventDefault();
    touchDragItem.classList.add('dragging');
    touchDragItem.style.opacity = '0.6';
    touchDragItem.style.position = 'relative';
    touchDragItem.style.zIndex = '10';
    const dy = e.touches[0].clientY - touchStartY;
    touchDragItem.style.transform = `translateY(${dy}px)`;
    listEl.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    const after = getDragAfter(listEl, e.touches[0].clientY);
    if (after && after !== touchDragItem) after.classList.add('drag-over');
  }, {passive: false});
  listEl.addEventListener('touchend', (e) => {
    if (!touchDragItem) return;
    touchDragItem.classList.remove('dragging');
    touchDragItem.style.opacity = '';
    touchDragItem.style.position = '';
    touchDragItem.style.zIndex = '';
    touchDragItem.style.transform = '';
    listEl.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    const after = getDragAfter(listEl, e.changedTouches[0].clientY);
    const draggedId = touchDragItem.dataset.id;
    const fromIdx = dataArr.findIndex(d => d.id === draggedId);
    if (fromIdx === -1) { touchDragItem = null; return; }
    const [moved] = dataArr.splice(fromIdx, 1);
    if (after && after !== touchDragItem) {
      const toIdx = dataArr.findIndex(d => d.id === after.dataset.id);
      dataArr.splice(toIdx, 0, moved);
    } else {
      dataArr.push(moved);
    }
    commitOrder();
    touchDragItem = null;
  });
}

function getDragAfter(container, y) {
  const items = [...container.querySelectorAll('.task-item:not(.dragging)')];
  return items.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > (closest.offset || Number.NEGATIVE_INFINITY)) {
      return {offset, element: child};
    }
    return closest;
  }, {offset: Number.NEGATIVE_INFINITY}).element;
}

function _roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function _wrapText(ctx, text, maxWidth) {
  const lines=[]; let cur='';
  const chars = String(text).split('');
  for (const ch of chars) {
    const test = cur + ch;
    if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = ch; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

function loadImage(src) {
  return new Promise((resolve) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => resolve(null);

  });
}

function downloadShareImage() {
  const {d, plans, spend, reviews, todayTotal, monthTotal} = getTodayShareData();
  // 收集复盘里所有图片，异步加载
  const imgTasks = [];
  reviews.forEach(r => (r.images || []).forEach(src => imgTasks.push(loadImage(src))));
  Promise.all(imgTasks).then(loadedImgs => {
    const scale = 2, W = 640, pad = 26, innerPad = 24;
    const contentW = W - 2*pad - 2*innerPad;
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const style = {
      title:{font:'bold 30px sans-serif', color:'#db2777', lh:46, mt:0, ml:0},
      sec:{font:'bold 22px sans-serif', color:'#e85d9a', lh:34, mt:18, ml:0},
      item:{font:'18px sans-serif', color:'#4a3040', lh:28, mt:6, ml:10},
      total:{font:'bold 18px sans-serif', color:'#db2777', lh:30, mt:8, ml:0},
      empty:{font:'16px sans-serif', color:'#b8a0aa', lh:24, mt:4, ml:10},
      foot:{font:'14px sans-serif', color:'#e85d9a', lh:24, mt:18, ml:0}
    };
    const ops = [];
    const pushText = (type, text) => {
      const st = style[type];
      ctx.font = st.font;
      String(text).split('\n').forEach(p => {
        _wrapText(ctx, p, contentW - st.ml).forEach((w, i) => ops.push({kind:'text', ...st, text:w, mt: i===0?st.mt:0}));
      });
    };
    const pushImg = (img) => {
      if (!img) return;
      const ar = img.height / img.width;
      let w = contentW, h = w * ar;
      const maxH = 240;
      if (h > maxH) { h = maxH; w = h / ar; }
      ops.push({kind:'img', img, w, h, mt:12});
    };
    let k = 0;
    pushText('title', '💌 妮妮的今日分享 · '+d);
    pushText('sec', '📅 每日计划');
    if (plans.length) plans.forEach(p=>pushText('item', (p.timeStart?('['+p.timeStart+(p.timeEnd?('-'+p.timeEnd):'')+'] '):'')+(p.done?'✓ ':'○ ')+p.text));
    else pushText('empty', '（暂无计划）');
    pushText('sec', '💳 每日花费');
    if (spend.length) {
      spend.forEach(r=>pushText('item', '· '+(r.cat||'其他')+'  ¥'+(Number(r.amount)||0).toFixed(2)+(r.note?('  '+r.note):'')));
      pushText('total', '今日开销 ¥'+todayTotal.toFixed(2)+'  |  本月累计 ¥'+monthTotal.toFixed(2));
    } else pushText('empty', '（暂无花费）');
    pushText('sec', '📖 每日复盘');
    if (reviews.length) {
      reviews.slice().reverse().forEach(r => {
        if (r.text) pushText('item', r.text);
        if (r.images && r.images.length) r.images.forEach(() => pushImg(loadedImgs[k++]));
      });
    } else pushText('empty', '（暂无复盘）');
    pushText('foot', '— 来自 妮妮的工作台 ❤ —');

    let H = pad*2 + innerPad*2 + 30;
    ops.forEach(op => H += (op.kind === 'img' ? op.h : op.lh) + op.mt);

    c.width = W*scale; c.height = H*scale;
    ctx.scale(scale, scale);
    const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#fce4ec'); g.addColorStop(1,'#f8bbd0');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    _roundRect(ctx, pad, pad, W-2*pad, H-2*pad, 18); ctx.fillStyle='#fff'; ctx.fill();

    let y = pad + innerPad;
    ops.forEach(op => {
      y += op.mt;
      if (op.kind === 'text') {
        ctx.font = op.font; ctx.fillStyle = op.color; ctx.textBaseline='top';
        ctx.fillText(op.text, pad+innerPad+op.ml, y);
        y += op.lh;
      } else {
        const x = pad+innerPad + (contentW - op.w)/2;
        ctx.save();
        _roundRect(ctx, x, y, op.w, op.h, 10);
        ctx.clip();
        ctx.drawImage(op.img, x, y, op.w, op.h);
        ctx.restore();
        y += op.h;
      }
    });

function renderSpending() {

  const records = allRecords.filter(r => r.date === viewDate);
  const thisDate = viewDate;
  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const todayTotal = records.reduce((s,r) => s + r.amount, 0);
  const monthTotal = allRecords.filter(r => r.date && r.date.startsWith(thisMonth)).reduce((s,r) => s + r.amount, 0);
  const summary = document.getElementById('spendingSummary');
  if (summary) {
    summary.innerHTML = `
      <div class="spending-stat"><div class="ss-val">¥${todayTotal.toFixed(2)}</div><div class="ss-label">${thisDate} 开销</div></div>
      <div class="spending-stat"><div class="ss-val">¥${monthTotal.toFixed(2)}</div><div class="ss-label">本月累计开销</div></div>
    `;
  }
  const table = document.getElementById('spendingTable');
  if (!table) return;
  if (!records.length) {
    table.innerHTML = '<div class="empty-hint">💸 该日期还没有消费记录呢~</div>';
    return;
  }
  table.innerHTML = `
    <thead><tr><th>时间</th><th>类目</th><th class="amount">金额</th><th>备注</th><th></th></tr></thead>
    <tbody>${records.slice().reverse().map(r => `
      <tr>
        <td>${r.time || ''}</td>

        <td class="amount">¥${r.amount.toFixed(2)}</td>
        <td>${escapeHtml(r.note || '')}</td>

function renderExerciseStats() {
  const checkins = getExerciseCheckins();
  const dateSet = new Set(checkins.map(c => c.date).filter(Boolean));
  const totalDays = dateSet.size;
  const streak = calcExerciseStreak(dateSet);
  const streakEl = document.getElementById('exStreak');
  const totalEl = document.getElementById('exTotalDays');
  if (streakEl) streakEl.textContent = streak;
  if (totalEl) totalEl.textContent = totalDays;
}

function calcExerciseStreak(dateSet) {
  let streak = 0;
  const d = new Date();
  d.setHours(0,0,0,0);
  while (true) {
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (dateSet.has(ds)) {
      streak++;
      d.setDate(d.getDate()-1);
    } else {
      break;
    }
  }
  return streak;
}

function renderExerciseCalendar() {
  const grid = document.getElementById('exCalendar');
  if (!grid) return;
  const checkins = getExerciseCheckins();
  const dateSet = new Set(checkins.map(c => c.date).filter(Boolean));
  const [year, month] = viewDate.split('-').map(Number);
  const firstDay = new Date(year, month-1, 1);
  const lastDay = new Date(year, month, 0);
  const startWeekDay = (firstDay.getDay() + 6) % 7;
  const daysInMonth = lastDay.getDate();
  const today = getToday();
  const headers = ['一','二','三','四','五','六','日'];
  let html = headers.map(h => `<div class="ex-cal-header">${h}</div>`).join('');
  for (let i=0; i<startWeekDay; i++) html += '<div class="ex-cal-cell empty"></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const ds = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const checked = dateSet.has(ds);
    const isToday = ds === today;
    html += `<div class="ex-cal-cell${checked ? ' checked' : ''}${isToday ? ' today' : ''}">${d}</div>`;
  }
  grid.innerHTML = html;
}

function viralKey(dateStr) { return 'nini_viral_' + dateStr; }
function loadViral(dateStr) {
  try { return JSON.parse(localStorage.getItem(viralKey(dateStr)) || 'null'); }
  catch(e) { return null; }
}
function saveViral(dateStr, data) {
  try { localStorage.setItem(viralKey(dateStr), JSON.stringify(data)); }
  catch(e) { /* 忽略 */ }
}
// 采集：取各赛道爆款，按热度排序，附采集日期与时间
function collectViral() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const items = VIRAL_SEED.slice().sort((a, b) => b.heat - a.heat).map((v, i) => ({
    rank: i + 1, title: v.title, track: v.track, platform: v.platform, heat: v.heat,
    reasons: v.reasons, inspiration: v.inspiration, keyword: v.keyword,
    url: (v.platform === '抖音'
      ? 'https://www.douyin.com/search/' + encodeURIComponent(v.keyword)
      : 'https://www.xiaohongshu.com/search_result?keyword=' + encodeURIComponent(v.keyword))
  }));
  const data = { date: getTodayStr(), time: hh + ':' + mm, items: items };
  saveViral(getTodayStr(), data);
  return data;
}
// 是否到了采集时间（05:00 之后）
function isViralCollectTime() { return new Date().getHours() >= 5; }
// 自动采集判断：未采集且已过05:00则采集；返回当前快照（可能为空）
function maybeCollectViral() {
  const dateStr = getTodayStr();
  let snap = loadViral(dateStr);
  if (!snap && isViralCollectTime()) snap = collectViral();
  return snap;
}
// 渲染爆款数据
function renderViral() {
  const box = document.getElementById('viralBox');
  if (!box) return;
  const dateStr = getTodayStr();
  const snap = loadViral(dateStr);
  if (snap && snap.items && snap.items.length) {
    const tracks = [...new Set(snap.items.map(i => i.track))];
    box.innerHTML = `
      <div class="airank-meta">📅 今日爆款已于 <b>${snap.time}</b> 自动采集 · 每天 05:00 更新 · 覆盖 ${tracks.length} 个赛道
        <button class="btn btn-mini" onclick="forceCollectViral()">立即刷新</button>
      </div>
      <div class="viral-list">
        ${snap.items.map(it => `
          <div class="viral-item">
            <div class="viral-head">
              <span class="viral-rank">${it.rank}</span>
              <div class="viral-title-wrap">
                <div class="viral-title">${escapeHtml(it.title)}</div>
                <div class="viral-meta">
                  <span class="viral-track">${escapeHtml(it.track)}</span>
                  <span class="viral-platform ${it.platform === '抖音' ? 'douyin' : 'xhs'}">${escapeHtml(it.platform)}</span>
                  <span class="viral-heat">🔥 ${it.heat}万</span>
                </div>
              </div>
              <a href="${escapeHtml(it.url)}" target="_blank" class="viral-btn" onclick="event.stopPropagation()">查看原视频 ↗</a>
            </div>
            <div class="viral-body">
              <div class="viral-col viral-reasons">
                <div class="viral-label reason">🔥 爆火核心原因</div>
                ${it.reasons.map(r => `<div class="viral-point">· ${escapeHtml(r)}</div>`).join('')}
              </div>
              <div class="viral-col viral-insp">
                <div class="viral-label insp">💡 可借鉴的创作启发</div>
                ${it.inspiration.map(s => `<div class="viral-point">· ${escapeHtml(s)}</div>`).join('')}
              </div>
            </div>
          </div>
        `).join('')}
      </div>`;
  } else if (!isViralCollectTime()) {
    box.innerHTML = `
      <div class="airank-meta">🕔 今日爆款将于 <b>05:00</b> 自动采集，明早就能看到啦~</div>
      <div class="airank-pending">🌟 前24小时各赛道爆款视频（含爆火原因 + 创作启发）每天早上 5 点自动生成，当前尚未到采集时间。</div>`;
  } else {
    collectViral();
    renderViral();
  }
}
// 手动刷新（强制采集今天的爆款）
function forceCollectViral() {
  collectViral();
  renderViral();
}

let financeGoalImages = [];
function addFinanceGoal() {
  const name = document.getElementById('goalName').value.trim();
  const target = parseFloat(document.getElementById('goalTarget').value);
  if (!name || !target) { alert('请填写目标名称和金额~'); return; }
  const goals = loadData('finance_goals');
  goals.push({id:genId(),name,target,saved:0});
  saveData('finance_goals', goals);
  document.getElementById('goalName').value = '';
  document.getElementById('goalTarget').value = '';
  renderFinanceGoals();
}

function renderFinanceGoals() {
  const container = document.getElementById('financeGoalList');
  if (!container) return;
  const goals = loadData('finance_goals');
  if (!goals.length) { container.innerHTML = '<div class="empty-hint">💰 设定一个存钱小目标吧~</div>'; return; }
  container.innerHTML = goals.map(g => {
    const pct = g.target > 0 ? Math.min(100, Math.round((g.saved / g.target) * 100)) : 0;
    return `
      <div class="repayment-card">
        <div class="rp-name">${escapeHtml(g.name)}</div>
        <div class="rp-amounts">¥${g.saved.toFixed(0)} / ¥${g.target.toFixed(0)}</div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${pct}%</div>
        <input type="number" placeholder="存入金额" style="width:90px;flex-shrink:0;" id="saveAmt_${g.id}" min="0">
        <button class="btn btn-secondary btn-sm" onclick="addSaving('${g.id}')">存入</button>
        <button class="btn btn-danger btn-sm" onclick="delGoal('${g.id}')">删除</button>
      </div>
    `;
  }).join('');
}

function addSaving(id) {
  const amt = parseFloat(document.getElementById('saveAmt_'+id).value);
  if (!amt || amt <= 0) return;
  const goals = loadData('finance_goals');
  const g = goals.find(g => g.id === id);
  if (g) { g.saved = (g.saved || 0) + amt; }
  saveData('finance_goals', goals);
  renderFinanceGoals();
}

function delGoal(id) {
  let goals = loadData('finance_goals');
  goals = goals.filter(g => g.id !== id);
  saveData('finance_goals', goals);
  renderFinanceGoals();
}

function addRepayment() {
  const friend = document.getElementById('repayFriend').value.trim();
  const total = parseFloat(document.getElementById('repayTotal').value);
  const paid = parseFloat(document.getElementById('repayPaid').value) || 0;
  const note = document.getElementById('repayNote').value.trim();
  if (!friend || !total || total <= 0) { alert('请填写好友名称和应收金额~'); return; }
  const records = loadData('repayment');
  records.push({id:genId(),friend,total,paid,note,date:viewDate});
  saveData('repayment', records);
  document.getElementById('repayFriend').value = '';
  document.getElementById('repayTotal').value = '';
  document.getElementById('repayPaid').value = '';
  document.getElementById('repayNote').value = '';
  renderRepaymentList();
}

function renderRepaymentList() {
  const container = document.getElementById('repaymentList');
  if (!container) return;
  const records = getByDate('repayment');
  if (!records.length) { container.innerHTML = '<div class="empty-hint">💸 该日期还没有返款记录，添加一条吧~</div>'; return; }
  container.innerHTML = records.map(r => {
    const progress = r.total > 0 ? Math.min(100, Math.round((r.paid / r.total) * 100)) : 0;
    return `
      <div class="repayment-card">
        <div class="rp-name">${escapeHtml(r.friend)}</div>
        <div class="rp-amounts">
          ${r.note ? `<div style="font-size:11px;color:var(--text-muted);">${escapeHtml(r.note)}</div>` : ''}
          <div>应收 ¥${r.total.toFixed(2)} | 已还 ¥${r.paid.toFixed(2)}</div>
          <div style="font-size:11px;color:var(--text-muted);">📅 ${r.date || ''}</div>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
        <div class="progress-label">${progress}%</div>
        <button class="btn btn-secondary btn-sm" onclick="payRepay('${r.id}')">💵 还款</button>
        <button class="btn btn-danger btn-sm" onclick="delRepay('${r.id}')">删除</button>
      </div>
    `;
  }).join('');
}

function payRepay(id) {
  const amt = parseFloat(prompt('请输入还款金额：'));
  if (!amt || amt <= 0) return;
  const records = loadData('repayment');
  const r = records.find(r => r.id === id);
  if (r) { r.paid = (r.paid || 0) + amt; }
  saveData('repayment', records);
  renderRepaymentList();
}

function delRepay(id) {
  let all = loadData('repayment');
  all = all.filter(r => r.id !== id);
  saveData('repayment', all);
  renderRepaymentList();
}

}

}

}

function renderSocialContent() {
  return `
    <div class="card">
      <div class="card-title"><span class="ct-icon">🤝</span> 人际关系备忘录 <span style="font-size:12px;color:var(--text-muted);font-weight:400;">（已解锁）</span></div>

        <button class="btn btn-secondary btn-sm" onclick="changeSocialLock()">🔑 修改密码</button>
        <button class="btn btn-secondary btn-sm" onclick="closeSocialLock()">🔓 关闭密码保护</button>
      </div>
    </div>`;
}

function setupSocialLock() {
  const p1 = document.getElementById('socialPwd1');
  const p2 = document.getElementById('socialPwd2');
  if (!p1 || !p2) return;
  const v1 = p1.value, v2 = p2.value;
  if (!v1 || v1.length < 4) { toast('密码至少 4 位哦~'); return; }
  if (v1 !== v2) { toast('两次输入的密码不一致~'); return; }
  try { localStorage.setItem('nini_social_lock', v1); } catch(e){}
  sessionStorage.setItem('nini_social_unlocked', '1');
  toast('🔐 密码已设置');
  renderPage();
}

function unlockSocial() {
  const inp = document.getElementById('socialPwdInput');
  if (!inp) return;
  const v = inp.value;
  const lock = socialLock();
  if (v === lock) {
    sessionStorage.setItem('nini_social_unlocked', '1');
    renderPage();
  } else {
    toast('密码错误，请重试~');
    inp.value = '';
    try { inp.focus(); } catch(e){}
  }
}

function changeSocialLock() {
  const old = socialLock();
  const cur = prompt('请输入当前密码：');
  if (cur == null) return;
  if (cur !== old) { alert('当前密码不正确~'); return; }
  const nv = prompt('设置新密码（至少 4 位）：');
  if (nv == null || nv.length < 4) { alert('密码至少 4 位~'); return; }
  try { localStorage.setItem('nini_social_lock', nv); } catch(e){}
  sessionStorage.setItem('nini_social_unlocked', '1');
  toast('🔑 密码已修改');
}

function closeSocialLock() {
  if (!confirm('关闭后人际关系板块将不再加密，确定关闭吗？')) return;
  try { localStorage.removeItem('nini_social_lock'); } catch(e){}
  sessionStorage.removeItem('nini_social_unlocked');
  toast('已关闭密码保护');
  renderPage();
}

function resetSocialLock() {
  if (!confirm('忘记密码会清空所有人际关系数据并重置加密，确定继续吗？此操作不可恢复！')) return;
  try {
    localStorage.removeItem('nini_social_lock');
    localStorage.removeItem('nini_social');
    sessionStorage.removeItem('nini_social_unlocked');
  } catch(e){}
  toast('已重置，请重新设置密码');
  renderPage();
}

// ==================== DATA BACKUP ====================
let backupKeys = [];
function renderBackup() {
  backupKeys = Object.keys(localStorage).filter(k => k.startsWith('nini_')).sort();
  let total = 0;
  const rows = backupKeys.map((k, i) => {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(k) || '[]'); } catch(e){ arr = []; }
    const count = Array.isArray(arr) ? arr.length : 1;
    total += count;
    const name = k.replace('nini_', '');
    return `<li class="bk-row">
      <span class="bk-name">${escapeHtml(name)}</span>
      <span class="bk-right"><span class="bk-count">${count} 条</span><button class="btn btn-mini" onclick="exportSingleKey(${i})">导出</button></span>
    </li>`;
  }).join('');
  const listHtml = rows || '<div class="empty-hint">还没有任何数据哦～</div>';
  return `
    <div class="card">
      <div class="card-title"><span class="ct-icon">💾</span> 数据导出 / 备份</div>
      <p class="text-muted" style="margin-bottom:14px;line-height:1.7;">把工作台里所有内容（计划、花费、打卡、笔记、图片等）导出存到手机或电脑，防止数据丢失；也可以把之前导出的文件再导入恢复。<br>⚠️ 导入会用备份覆盖当前同名数据，恢复前请先确认。</p>
      <div class="flex gap-8 flex-wrap">
        <button class="btn btn-primary" onclick="exportAllData()">⬇️ 导出全部(JSON)</button>
        <button class="btn btn-secondary" onclick="exportAllCsv()">📊 导出为 Excel(CSV)</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFileInput').click()">⬆️ 导入恢复</button>
        <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;" onchange="importDataFromFile(this)">
      </div>
      <div class="sub-section" style="margin-top:16px;">
        <div class="sub-section-title"><span>⏰</span> 定时备份提醒</div>
        <p class="text-muted" style="margin-bottom:10px;">开启后，超过设定周期未备份时会自动弹窗提醒你，避免数据丢失。</p>
        <div class="flex gap-8 flex-wrap items-center">
          <label style="font-size:13px;color:var(--text-secondary);">提醒频率：</label>
          <select id="backupFreq" class="bk-select" onchange="setBackupFreq(this.value)">
            <option value="off">关闭</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
          </select>
          <span id="backupLastInfo" class="text-muted" style="font-size:12px;"></span>
        </div>
      </div>
      <div class="section-divider"></div>
      <div class="sub-section-title"><span>📦</span> 当前数据概览（共 ${backupKeys.length} 项 / 约 ${total} 条，可单独导出）</div>
      <ul class="bk-list">${listHtml}</ul>
    </div>
  `;
}

function updateBackupTimestamp() {
  const r = getBackupReminder();
  r.lastBackup = Date.now();
  localStorage.setItem('nini_backup_reminder', JSON.stringify(r));
  renderBackupReminderInfo();
}

function getBackupReminder() {
  try { return JSON.parse(localStorage.getItem('nini_backup_reminder') || '{"freq":"off","lastBackup":0}'); }
  catch(e){ return {freq:'off', lastBackup:0}; }
}

function setBackupFreq(freq) {
  const r = getBackupReminder();
  r.freq = freq;
  localStorage.setItem('nini_backup_reminder', JSON.stringify(r));
  const label = {off:'关闭', daily:'每天', weekly:'每周'}[freq] || freq;
  toast('已设置提醒：' + label);
  checkBackupReminder();
}

function renderBackupReminderInfo() {
  const r = getBackupReminder();
  const el = document.getElementById('backupLastInfo');
  if (el) el.textContent = '上次备份：' + (r.lastBackup ? new Date(r.lastBackup).toLocaleString('zh-CN') : '从未');
  const sel = document.getElementById('backupFreq');
  if (sel) sel.value = r.freq || 'off';
}

function checkBackupReminder() {
  const r = getBackupReminder();
  if (!r.freq || r.freq === 'off') return;
  const gap = r.freq === 'daily' ? 24*3600*1000 : 7*24*3600*1000;
  if (!r.lastBackup || (Date.now() - r.lastBackup) > gap) {
    const last = r.lastBackup ? new Date(r.lastBackup).toLocaleString('zh-CN') : '从未';
    toast('💡 好久没备份啦～上次备份：' + last + '，记得去「数据备份」导出一下哦', 6000);
  }
}

function exportSingleKey(idx) {
  const k = backupKeys[idx];
  if (!k) return;
  const val = localStorage.getItem(k);
  if (val == null) { toast('没有可导出的数据'); return; }
  const blob = new Blob([val], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date(); const pad = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = `妮妮_${k.replace('nini_','')}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  updateBackupTimestamp();
  toast('✅ 已导出：' + k.replace('nini_',''));
}

function csvCell(v) {
  v = String(v == null ? '' : v).replace(/\r?\n/g, ' ').replace(/"/g, '""');
  if (/[",\n]/.test(v)) v = '"' + v + '"';
  return v;
}

function exportAllCsv() {
  const keys = Object.keys(localStorage).filter(k => k.startsWith('nini_')).sort();
  if (!keys.length) { toast('暂时没有可导出的数据'); return; }
  const sections = [];
  keys.forEach(k => {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(k) || '[]'); } catch(e){}
    if (!Array.isArray(arr) || !arr.length) return;
    const name = k.replace('nini_', '');
    const cols = new Set();
    arr.forEach(r => { if (r && typeof r === 'object') Object.keys(r).forEach(c => cols.add(c)); });
    const colList = Array.from(cols);
    const lines = ['=== ' + name + ' (' + arr.length + ' 条) ===', colList.join(',')];
    arr.forEach(r => {
      lines.push(colList.map(c => csvCell(r && r[c] != null ? r[c] : '')).join(','));
    });
    sections.push(lines.join('\n'));
  });
  if (!sections.length) { toast('没有可导出为表格的数据'); return; }
  const csv = '﻿' + sections.join('\n\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date(); const pad = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = `妮妮的工作台_表格_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  updateBackupTimestamp();
  toast('✅ 已导出 Excel(CSV)');
}

function exportAllData() {
  const data = {};
  Object.keys(localStorage).forEach(k => {
    if (k.startsWith('nini_')) data[k] = localStorage.getItem(k);
  });
  if (Object.keys(data).length === 0) { toast('暂时没有可导出的数据'); return; }
  const payload = { app:'nini-workbench', version:1, exportedAt:new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = `妮妮的工作台_备份_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  updateBackupTimestamp();
  toast('✅ 已导出全部数据');
}

function importDataFromFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    try {
      const payload = JSON.parse(reader.result);
      const data = (payload && payload.data) ? payload.data : payload;
      let n = 0;
      Object.keys(data).forEach(k => {
        if (typeof data[k] === 'string' && k.startsWith('nini_')) {
          localStorage.setItem(k, data[k]);
          n++;
        }
      });
      if (n === 0) { toast('⚠️ 文件中没有可恢复的数据'); return; }
      updateBackupTimestamp();
      toast('✅ 已恢复 ' + n + ' 项数据，正在刷新…');
      setTimeout(() => { renderNav(); renderPage(); }, 600);
    } catch(e) {
      toast('⚠️ 文件格式不正确，导入失败');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function hapticTick() {
  if (navigator.vibrate) try { navigator.vibrate(8); } catch(e) {}
}

// ==================== HELPERS ====================
function setupTaskToggle(listId, dataArr, saveKey, renderFn) {
  const list = document.getElementById(listId);
  if (!list || list._wbToggleBound) return;
  list._wbToggleBound = true;
  list.addEventListener('click', (e) => {
    const toggle = e.target.closest('[data-toggle]');
    if (!toggle) return;
    const id = toggle.dataset.toggle;
    const item = dataArr.find(d => d.id === id);
    if (item) item.done = !item.done;
    saveData(saveKey, dataArr);
    hapticTick();
    renderFn();
  });
}

function setupTaskDelete(listId, dataArr, saveKey, renderFn) {
  const list = document.getElementById(listId);
  if (!list || list._wbDelBound) return;
  list._wbDelBound = true;
  list.addEventListener('click', (e) => {
    const delBtn = e.target.closest('[data-del]');
    if (!delBtn) return;
    const id = delBtn.dataset.del;
    const idx = dataArr.findIndex(d => d.id === id);
    if (idx !== -1) dataArr.splice(idx, 1);
    saveData(saveKey, dataArr);
    renderFn();
  });
}

// ==================== DATE NAVIGATION ====================
function shiftDate(delta, pageId) {
  const d = new Date(viewDate);
  d.setDate(d.getDate() + delta);
  viewDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  refreshDatePage(pageId);
}

function onDateChange(pageId) {
  const input = document.querySelector('.date-nav-input');
  if (input && input.value) viewDate = input.value;
  refreshDatePage(pageId);
}

function goToday(pageId) {
  viewDate = getToday();
  refreshDatePage(pageId);
}

function refreshDatePage(pageId) {
  // Update date input in DOM
  const input = document.querySelector('.date-nav-input');
  if (input) input.value = viewDate;
  const label = document.getElementById('dlDateLabel') || document.getElementById('exDateLabel') || document.getElementById('rpDateLabel');
  if (label) {
    const d = new Date(viewDate);
    const w = ['日','一','二','三','四','五','六'][d.getDay()];
    label.textContent = `星期${w}`;
  }
  // Re-render the specific page data
  if (pageId === 'dailylife') {
    renderDailyPlans(); renderSpending(); renderReviewHistory(); renderTodayShare();
  } else if (pageId === 'exercise') {
    renderExerciseList();
  } else if (pageId === 'repayment') {
    renderRepaymentList();
  }
}

// ==================== INIT ====================
function init() {
  renderNav();
  setupMobileMenu();
  renderPage();
  setInterval(updateClock, 1000);
  // AI 每日榜单 + 小红书爆款数据：每分钟检查，分别每天 09:00 / 05:00 后自动生成当日快照
  setInterval(() => {
    maybeCollectAiRank();
    if (growthTab === 'AI成长' && document.getElementById('aiRankBox')) renderAiRank();
    maybeCollectViral();
    if (growthTab === '小红书' && document.getElementById('viralBox')) renderViral();
  }, 60000);
  // 定时备份提醒：进入时检查一次，之后每 30 分钟再检查
  checkBackupReminder();
  setInterval(checkBackupReminder, 30 * 60 * 1000);
  // 图片查看器：点背景或按返回键关闭
  const lb = document.getElementById('imgLightbox');
  if (lb) {
    lb.addEventListener('click', (e) => {
      if (e.target === lb || e.target.classList.contains('img-lightbox-hint')) closeLightbox();
    });
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('imgLightbox') && document.getElementById('imgLightbox').classList.contains('show')) closeLightbox();
  });
  // 复盘/笔记/备忘录里的图片点击放大
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t && t.classList && t.classList.contains('review-img-thumb')) openLightbox(t.src);
  });
}

document.addEventListener('DOMContentLoaded', init);
